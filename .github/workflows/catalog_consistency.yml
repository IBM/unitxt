name: Test Catalog Consistency

on:
   push:
     branches: [ main ]
   pull_request:
     branches: [ main ]

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
    cancel-in-progress: true

jobs:
   consistency:

     permissions:
       contents: read
     # Pinned, not ubuntu-latest: the 26.04 image has no Python 3.8/3.9 and its
     # toolchain fails to build pytrec-eval. See .github/workflows/README.md.
     runs-on: ubuntu-24.04
     timeout-minutes: 30
     env:
       OS: ubuntu-24.04
       UNITXT_DEFAULT_VERBOSITY: error
       DATASETS_VERBOSITY: error
       HF_HUB_VERBOSITY: error
       HF_DATASETS_DISABLE_PROGRESS_BARS: True
       HF_HUB_DOWNLOAD_TIMEOUT: 60
       HF_HUB_ETAG_TIMEOUT: 60
       TQDM_DISABLE: True

     steps:
     - uses: actions/checkout@v4

     - uses: actions/setup-python@v5
       with:
         python-version: '3.9'

     - run: curl -LsSf https://astral.sh/uv/install.sh | sh
     - run: uv pip install --system -e ".[tests]"

     - name: Run Tests
       run: python utils/prepare_all_artifacts.py