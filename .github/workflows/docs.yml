name: Test Docs Compilation

on:
    push:
      branches: [ main ]
    pull_request:
      branches: [ main ]

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
    cancel-in-progress: true

jobs:
    docs:

      permissions:
        contents: read
      # Pinned, not ubuntu-latest: the 26.04 image has no Python 3.8/3.9 and its
      # toolchain fails to build pytrec-eval. See .github/workflows/README.md.
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      env:
        OS: ubuntu-24.04
        PYTHONPATH: ./docs

      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: '3.8'

        - run: curl -LsSf https://astral.sh/uv/install.sh | sh
        - run: uv pip install --system ".[docs]"

        - name: Compile Docs
          run: make docs


