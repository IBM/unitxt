name: Test HELM Integration

on:
    push:
      branches: [ main ]
    pull_request:
      branches: [ main ]

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
    cancel-in-progress: true

jobs:
    helm:

      permissions:
        contents: read
      runs-on: ubuntu-latest
      timeout-minutes: 30
      env:
        OS: ubuntu-latest

      steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: uv pip install --upgrade --system "diskcache"
      - run: uv pip install --upgrade --system "crfm-helm[unitxt]>=0.5.3"
      - run: uv pip install --system "scikit-learn==1.5.2"
      # datasets 5.0.0 removed the verification_mode argument of
      # DatasetBuilder.as_dataset(), which HELM's bundled unitxt scenario still
      # passes, so helm-run dies with a TypeError. Keep HELM on the 4.x line
      # until it stops passing that argument.
      - run: uv pip install --system "datasets<5"

      - name: Test Helm
        run: utils/run_helm.sh

