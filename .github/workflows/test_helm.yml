name: Test HELM Integration

on:
    push:
      branches: [ main ]
    pull_request:
      branches: [ main ]

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
    cancel-in-progress: true

jobs:
    helm:

      permissions:
        contents: read
      # Pinned, not ubuntu-latest: the 26.04 image has no Python 3.8/3.9 and its
      # toolchain fails to build pytrec-eval. See .github/workflows/README.md.
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      env:
        OS: ubuntu-24.04

      steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: uv pip install --upgrade --system "diskcache"
      - run: uv pip install --upgrade --system "crfm-helm[unitxt]>=0.5.3"
      - run: uv pip install --system "scikit-learn==1.5.2"

      - name: Test Helm
        run: utils/run_helm.sh

